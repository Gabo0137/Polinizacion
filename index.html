<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163e34">
  <link rel="icon" type="image/png" href="abeja.png">
  <title>Abeja Aventurera · Inicio</title>
  <style>
    :root{font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;color:#4c3024}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#173c34}
    .start-screen{position:relative;isolation:isolate;display:grid;place-items:center;width:100%;height:100%;min-height:100svh;overflow:hidden;background:#173c34}
    .garden-bg{position:absolute;inset:0;z-index:-3;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.9) brightness(.68);transform:scale(1.04)}
    .start-screen:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(135deg,#0d2c28bb 0%,#1a4d3bb0 48%,#5e4b2b88 100%)}
    .start-screen:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at center,#fff4c518 0%,transparent 58%),linear-gradient(0deg,#071f1c66,transparent 42%);pointer-events:none}
    .leaf{position:absolute;z-index:1;font-size:clamp(34px,6vw,80px);line-height:1;filter:drop-shadow(0 4px 2px #102e2377);animation:sway 4.5s ease-in-out infinite}
    .leaf.top-left{left:1%;top:-2%;transform:rotate(-26deg)}.leaf.top-right{right:1%;top:0;transform:scaleX(-1) rotate(-26deg);animation-delay:-2.2s}.leaf.bottom-left{left:5%;bottom:2%;font-size:clamp(28px,4vw,55px);animation-delay:-1.2s}.leaf.bottom-right{right:6%;bottom:3%;font-size:clamp(28px,4vw,55px);transform:scaleX(-1);animation-delay:-3.1s}
    .flower{position:absolute;z-index:1;font-size:clamp(30px,5vw,72px);filter:drop-shadow(0 5px 3px #102e2388);animation:sway 3.8s ease-in-out infinite}.flower.left{left:3%;bottom:13%}.flower.right{right:3%;bottom:12%;animation-delay:-1.8s}.flower.small-left{left:17%;bottom:5%;font-size:clamp(23px,3vw,44px);animation-delay:-2.8s}.flower.small-right{right:17%;bottom:6%;font-size:clamp(23px,3vw,44px);animation-delay:-.6s}
    .welcome-card{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:min(880px,calc(100% - 28px));max-height:calc(100% - 24px);padding:clamp(12px,2.3vh,24px) clamp(14px,2.8vw,32px) clamp(14px,2.5vh,25px);border:clamp(3px,.55vw,6px) solid #d49b3d;border-radius:clamp(22px,3vw,34px);background:linear-gradient(150deg,#fff8eaf7 0%,#f7e1aaf4 68%,#e5b55df2 100%);box-shadow:inset 0 2px 0 #fff8bd,0 13px 0 #39251d88,0 24px 55px #0009;overflow:visible;animation:cardIn .8s cubic-bezier(.2,.8,.2,1) both}
    .welcome-card:before,.welcome-card:after{content:"🌿";position:absolute;z-index:3;font-size:clamp(30px,5vw,62px);filter:drop-shadow(0 4px 2px #315c2e88);animation:sway 4s ease-in-out infinite;pointer-events:none}.welcome-card:before{left:-25px;top:-22px;transform:rotate(-28deg)}.welcome-card:after{right:-25px;bottom:-20px;transform:scaleX(-1) rotate(-28deg);animation-delay:-2s}
    .title-sign{position:relative;width:min(720px,94%);padding:clamp(10px,2vh,20px) clamp(18px,4vw,55px) clamp(12px,2.1vh,22px);border:4px solid #57291d;border-radius:50% 48% 44% 52% / 31% 34% 35% 38%;background:linear-gradient(160deg,#a85b2b,#74351f 65%,#522719);box-shadow:inset 0 3px 0 #f2a454,0 7px 0 #3b211b,0 12px 16px #603b2666;transform:rotate(-1deg)}
    .title-sign:before{content:"";position:absolute;inset:10% 3%;border:2px solid #ffc87588;border-radius:inherit;pointer-events:none}.title-sign:after{content:"";position:absolute;left:9%;right:9%;bottom:-12px;height:16px;border-radius:50%;background:#3c281d;filter:blur(1px);z-index:-1}
    h1{position:relative;margin:0;color:#ffe18a;text-align:center;font-weight:1000;line-height:.9;letter-spacing:.035em;font-size:clamp(32px,min(8vw,10vh),78px);text-transform:uppercase;text-shadow:0 3px 0 #6e2b20,0 6px 0 #3e211e,0 0 13px #ffd86655;animation:shine 3s ease-in-out infinite}
    .ornament{position:absolute;z-index:2;top:-25px;left:50%;width:100%;transform:translateX(-50%);pointer-events:none}.ornament:before,.ornament:after{content:"🍃";position:absolute;font-size:clamp(24px,4vw,48px);filter:drop-shadow(0 3px 1px #365e2e);animation:sway 3.5s ease-in-out infinite}.ornament:before{left:2%;transform:rotate(-24deg)}.ornament:after{right:2%;transform:scaleX(-1) rotate(-24deg);animation-delay:-1.6s}
    .intro-panel{display:grid;grid-template-columns:minmax(130px,190px) minmax(0,1fr);align-items:center;gap:clamp(12px,3vw,28px);width:min(760px,100%);margin-top:clamp(11px,2vh,20px);padding:clamp(10px,2vh,18px) clamp(12px,2vw,22px);border:3px solid #d5a94e;border-radius:26px;background:#fff8dfdc;box-shadow:0 6px 0 #a66b2b44,inset 0 0 18px #fff}
    .bee-wrap{display:grid;place-items:center;min-height:clamp(92px,17vh,150px)}.bee{display:block;width:min(100%,170px);height:auto;filter:drop-shadow(0 8px 4px #5a382744);animation:beeFloat 2.6s ease-in-out infinite}
    .welcome-message{margin:0;text-align:center;font-size:clamp(17px,min(2.5vw,3.2vh),25px);font-weight:900;line-height:1.25;color:#7d2c99;text-shadow:0 2px 0 #fff}
    .message-sub{margin:8px 0 0;text-align:center;font-size:clamp(13px,min(1.7vw,2.2vh),18px);line-height:1.3;color:#4c3024}
    .start-button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:14px;margin-top:clamp(13px,2.4vh,24px);min-width:min(390px,92%);padding:clamp(11px,1.8vh,17px) 52px clamp(11px,1.8vh,17px) 24px;border:4px solid #a85b15;border-radius:999px;color:#572414;background:linear-gradient(#ffe84a 0%,#ffc51e 55%,#f49a0e 100%);box-shadow:inset 0 3px 0 #fff9a9,0 6px 0 #6d351a,0 11px 18px #8d4d2355;font:1000 clamp(20px,min(3vw,3.8vh),30px)/1 "Trebuchet MS","Arial Rounded MT Bold",sans-serif;text-shadow:0 2px 0 #fff4a8;cursor:pointer;transition:transform .16s,filter .16s,box-shadow .16s;animation:buttonPulse 2.6s ease-in-out infinite}
    .start-button:hover{filter:brightness(1.07) saturate(1.1);transform:translateY(-3px);box-shadow:inset 0 3px 0 #fff9a9,0 9px 0 #6d351a,0 14px 22px #8d4d2355}.start-button:active{transform:translateY(4px);box-shadow:inset 0 3px 0 #fff9a9,0 2px 0 #6d351a}.start-button:focus-visible{outline:4px solid #fff5a4;outline-offset:4px}
    .play{position:absolute;right:12px;top:50%;display:grid;place-items:center;width:clamp(34px,5vh,44px);height:clamp(34px,5vh,44px);color:#fff;font-size:clamp(15px,2.2vh,21px);text-shadow:none;background:#9e5117;border:3px solid #6c3215;border-radius:50%;transform:translateY(-50%);box-shadow:inset 0 2px 0 #e89939}
    .garden-note{margin:clamp(10px,1.6vh,16px) 0 0;padding:clamp(6px,1vh,9px) 16px;color:#2d733f;text-align:center;font-size:clamp(12px,min(1.6vw,2vh),16px);font-weight:900;background:#dcf5b5;border:2px solid #8bc85c;border-radius:18px;box-shadow:0 3px 0 #69984955}
    .fade-out{animation:fadeOut .55s ease forwards;pointer-events:none}
    @keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes shine{0%,100%{filter:saturate(1)}50%{filter:saturate(1.18) brightness(1.08)}}@keyframes beeFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:5deg}}@keyframes buttonPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.06)}}@keyframes fadeOut{to{opacity:0;transform:scale(1.03)}}
    @media(max-width:600px){
      .welcome-card{width:calc(100% - 18px);max-height:calc(100% - 14px);padding:9px 8px 11px;border-radius:22px}.welcome-card:before,.welcome-card:after{font-size:25px}.welcome-card:before{left:-13px;top:-14px}.welcome-card:after{right:-13px;bottom:-13px}
      .title-sign{width:96%;padding:9px 12px 12px}.title-sign:before{border-width:1px}h1{font-size:clamp(27px,8.5vw,43px)}.ornament{top:-16px}.ornament:before,.ornament:after{font-size:22px}
      .intro-panel{grid-template-columns:78px minmax(0,1fr);gap:7px;margin-top:9px;padding:7px 8px;border-radius:18px}.bee-wrap{min-height:67px}.bee{width:78px}.welcome-message{font-size:clamp(14px,4.2vw,20px)}.message-sub{margin-top:4px;font-size:11px;line-height:1.2}
      .start-button{min-width:94%;margin-top:10px;padding:10px 45px 10px 14px;font-size:18px;border-width:3px}.play{right:8px;width:31px;height:31px;font-size:14px;border-width:2px}.garden-note{margin-top:7px;padding:5px 7px;font-size:10px}
      .flower.left{left:-5%;bottom:7%}.flower.right{right:-5%;bottom:6%}
    }
    @media(max-width:600px) and (max-height:500px){.welcome-card{padding:5px 6px 6px}.title-sign{padding:6px 10px 8px}h1{font-size:25px}.intro-panel{margin-top:5px;padding:4px 5px}.bee-wrap{min-height:43px}.bee{width:52px}.welcome-message{font-size:13px}.message-sub{font-size:9px}.start-button{margin-top:6px;padding:6px 38px 6px 10px;font-size:14px}.play{width:24px;height:24px}.garden-note{margin-top:4px;font-size:8px;padding:3px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="start-screen" id="startScreen">
    <img class="garden-bg" src="Pradera florida con animales y cascada.webp" alt="Jardín colorido con flores y montañas">
    <div class="leaf top-left" aria-hidden="true">🌿</div><div class="leaf top-right" aria-hidden="true">🌿</div><div class="leaf bottom-left" aria-hidden="true">🍃</div><div class="leaf bottom-right" aria-hidden="true">🍃</div>
    <div class="flower left" aria-hidden="true">🌺</div><div class="flower right" aria-hidden="true">🌸</div><div class="flower small-left" aria-hidden="true">🌼</div><div class="flower small-right" aria-hidden="true">🌷</div>
    <section class="welcome-card" aria-labelledby="gameTitle">
      <div class="title-sign"><div class="ornament" aria-hidden="true"></div><h1 id="gameTitle">Abeja<br>Aventurera</h1></div>
      <div class="intro-panel"><div class="bee-wrap"><img class="bee" src="abejita-protagonista.png" alt="Abejita sonriente"></div><p class="welcome-message">¡Explora, aprende y ayuda a polinizar el jardín!</p></div>
      <button class="start-button" id="startButton" type="button">¡Comenzar aventura! <span class="play" aria-hidden="true">▶</span></button>
    </section>
  </main>
  <script>
    (() => {
      const screen = document.getElementById('startScreen');
      const button = document.getElementById('startButton');
      let navigating = false;
      button.addEventListener('click', () => {
        if (navigating) return;
        navigating = true;
        button.setAttribute('aria-busy', 'true');
        screen.classList.add('fade-out');
        window.setTimeout(() => { window.location.href = 'abeja_aventurera_5_misiones.html'; }, 550);
      });
    })();
  </script>
</body>
</html>
